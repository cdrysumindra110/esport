<!DOCTYPE html>
<html>
<body>
    <h2>Test OCR Upload</h2>
    <form id="testForm">
        <input type="file" id="testFile" accept=".png,.jpg,.jpeg">
        <button type="submit">Test</button>
    </form>
    <div id="result"></div>
    
    <script>
    document.getElementById('testForm').onsubmit = async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('testFile');
        const formData = new FormData();
        formData.append('statsFile', fileInput.files[0]);
        
        try {
            const response = await fetch('ocr_backend.php', {
                method: 'POST',
                body: formData
            });
            const text = await response.text();
            document.getElementById('result').innerHTML = `<pre>${text}</pre>`;
        } catch (error) {
            document.getElementById('result').innerHTML = `Error: ${error.message}`;
        }
    };
    </script>
</body>
</html>
